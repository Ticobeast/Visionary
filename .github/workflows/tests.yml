# Lance tous les tests à chaque pull request et à chaque changement de main.
# Python 3.9 est la version du PC (Windows) ; 3.13 est la plus récente utilisée pour écrire le programme.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests
