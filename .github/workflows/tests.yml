# Lance tous les tests à chaque pull request et à chaque changement de main.
# Python 3.9 sous Windows : comme le PC. Python 3.13 sous Linux : comme l'endroit où le programme est écrit.
# (Python 3.9 n'est plus offert sur les machines Linux récentes de GitHub.)
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests
